name: Persistent Engineering Continuation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/persistent-continuation.yml"
      - "scripts/persistent-continuation.mjs"
      - "scripts/github-health-inventory.mjs"
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: read
  actions: read
  issues: read
  pull-requests: read

concurrency:
  group: persistent-engineering-continuation
  cancel-in-progress: true

jobs:
  continue:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MAX_CYCLES: "2400"
      STATE_PATH: artifacts/persistent-continuation/state.json
      MAX_REPOSITORIES: "250"
      OUTPUT_DIR: artifacts/persistent-continuation/evidence
      CONTINUATION_CACHE_KEY: persistent-continuation-${{ github.ref_name }}-${{ github.run_id }}
    steps:
      - name: Check out control center
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore previous continuation state
        uses: actions/cache/restore@v4
        with:
          path: artifacts/persistent-continuation
          key: persistent-continuation-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            persistent-continuation-${{ github.ref_name }}-
            persistent-continuation-main-

      - name: Run bounded read-only continuation
        env:
          REPO_AUDIT_TOKEN: ${{ secrets.REPO_AUDIT_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/persistent-continuation.mjs

      - name: Save continuation state for the next cycle
        uses: actions/cache/save@v4
        with:
          path: artifacts/persistent-continuation
          key: persistent-continuation-${{ github.ref_name }}-${{ github.run_id }}

      - name: Upload continuation state and health evidence
        uses: actions/upload-artifact@v4
        with:
          name: persistent-continuation-${{ github.run_id }}
          path: artifacts/persistent-continuation/
          if-no-files-found: error
          retention-days: 90
