name: GitHub Health Inventory

on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * *"

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: github-health-inventory
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MAX_REPOSITORIES: "250"
      OUTPUT_DIR: artifacts/github-health
    steps:
      - name: Check out control center
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collect read-only repository health
        env:
          REPO_AUDIT_TOKEN: ${{ secrets.REPO_AUDIT_TOKEN || github.token }}
        run: node scripts/github-health-inventory.mjs

      - name: Upload inventory artifacts
        uses: actions/upload-artifact@v4
        with:
          name: github-health-${{ github.run_id }}
          path: artifacts/github-health/
          if-no-files-found: error
          retention-days: 30
